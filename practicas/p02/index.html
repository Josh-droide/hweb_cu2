<!DOCTYPE html> <!--Defines the document type-->
<html lang="en"> <!--Defines the root of an HTML document-->
<head> <!--Contains metadata/information for the document-->
    <meta charset="UTF-8"> <!--Defines metadata about an HTML document-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Defines metadata about an HTML document-->
    <title>Inteligencia Financiera</title> <!--Defines a title for the document-->
</head> <!--Contains metadata/information for the document-->
<body> <!--Defines the document's body-->
    Elegir un buen título en la etiqueta "title" 
    de un documento HTML es fundamental para el 
     posicionamiento en buscadores (SEO), la experiencia del usuario y la identificación de la página.
</body> <!--Defines the document's body-->
</html> <!--Defines the root of an HTML document-->
